name: Deploy Next.js to VPS (rsync + zero downtime)

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      # 1️⃣ Checkout repository
      - name: Checkout code
        uses: actions/checkout@v4

      # 2️⃣ Sync files to VPS using rsync (fast & clean)
      - name: Rsync code to VPS
        uses: burnett01/rsync-deployments@6.0.0
        with:
          switches: -avz --delete --quiet
          path: ./
          remote_path: /coverfrontend
          remote_host: ${{ secrets.VPS_HOST }}
          remote_user: ${{ secrets.VPS_USER }}
          remote_key: ${{ secrets.VPS_SSH_KEY }}

      # 3️⃣ Build and reload Next.js with zero downtime
      - name: Build & Reload App
        uses: appleboy/ssh-action@v1.0.0
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          script: |
            cd /coverfrontend
            rm -rf .next
            npm install
            npm run build
            pm2 reload frontend || pm2 start npm --name frontend -- start
