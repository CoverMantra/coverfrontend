name: Deploy Next.js to VPS

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Sync code to VPS
        uses: burnett01/rsync-deployments@6.0.0
        with:
          switches: -avz --delete --exclude=node_modules --exclude=.git --exclude=.next
          path: ./
          remote_path: /root/coverfrontend
          remote_host: ${{ secrets.VPS_HOST }}
          remote_user: ${{ secrets.VPS_USER }}
          remote_key: ${{ secrets.VPS_SSH_KEY }}
          remote_port: 22

      - name: Install Dependencies & Restart PM2
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          port: 22
          script: |
            cd /root/coverfrontend
            
            # Clean install dependencies
            npm ci
            
            # Restart PM2 app (agar pehli baar hai to start ho jaayega)
            pm2 restart frontend || pm2 start npm --name "frontend" -- start
            
            # Status check (optional but helpful for logs)
            pm2 status frontend