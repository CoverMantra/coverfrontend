name: Deploy Next.js to VPS

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Sync code to VPS
        uses: burnett01/rsync-deployments@6.0.0  # Latest version use kar lo if possible
        with:
          switches: -avz --delete --exclude=node_modules --exclude=.git
          path: ./
          remote_path: /root/coverfrontend
          remote_host: ${{ secrets.VPS_HOST }}
          remote_user: ${{ secrets.VPS_USER }}
          remote_key: ${{ secrets.VPS_SSH_KEY }}  # Direct secret string
          remote_port: 22

      - name: Build and restart on VPS
        uses: appleboy/ssh-action@v1.0.0
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}  # Same secret
          port: 22
          script: |
            cd /root/coverfrontend
            rm -rf .next
            npm ci  # Clean install better than npm install
            npm run build
            pm2 delete frontend || true
            pm2 start npm --name "frontend" -- start