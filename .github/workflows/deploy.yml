name: Deploy Next.js to VPS

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup SSH known_hosts
        run: |
          mkdir -p ~/.ssh
          ssh-keyscan -H ${{ secrets.VPS_HOST }} >> ~/.ssh/known_hosts
          cat ~/.ssh/known_hosts

      - name: Test SSH Connection
        run: |
          echo "${{ secrets.VPS_SSH_KEY }}" > /tmp/key
          chmod 600 /tmp/key
          ssh -i /tmp/key ${{ secrets.VPS_USER }}@${{ secrets.VPS_HOST }} "echo 'SSH Connection Successful!' && whoami && pwd"

      - name: Sync code to VPS
        uses: burnett01/rsync-deployments@6.0.0
        with:
          switches: -avz --delete --exclude=node_modules --exclude=.git --exclude=.next
          path: ./
          remote_path: /root/coverfrontend
          remote_host: ${{ secrets.VPS_HOST }}
          remote_user: ${{ secrets.VPS_USER }}
          remote_key: ${{ secrets.VPS_SSH_KEY }}
          remote_port: 22

      - name: Install Dependencies & Restart PM2
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          port: 22
          script_stop: true
          script: |
            cd /root/coverfrontend
            
            echo "Installing dependencies..."
            npm ci
            
            echo "Building Next.js application..."
            npm run build
            
            echo "Restarting PM2 process..."
            # Check if the PM2 process exists
            if pm2 list | grep -q frontend; then
              echo "Restarting existing frontend process..."
              pm2 restart frontend
            else
              echo "Starting new frontend process..."
              pm2 start npm --name "frontend" -- start
            fi
            
            # Save PM2 process list
            pm2 save
            
            echo "Checking PM2 status..."
            pm2 status frontend
            
            # List all PM2 processes for debugging
            pm2 list