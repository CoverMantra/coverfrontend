name: Deploy Next.js to VPS

on:
  push:
    branches:
      - main

jobs:
  deploy:
    if: contains(github.event.head_commit.message, '[deploy]')
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      # Upload repo directly to /root/coverfrontend
      - name: Upload project to VPS
        uses: appleboy/scp-action@v1
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          password: ${{ secrets.PASSWORD }}
          port: 22
          source: "./"
          target: "/root/coverfrontend"
          strip_components: 1

      - name: Server build & restart
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          password: ${{ secrets.PASSWORD }}
          port: 22
          script: |
            cd /root/coverfrontend

            echo "Cleaning old build..."
            rm -rf .next node_modules

            echo "Installing dependencies..."
            npm ci

            echo "Building Next.js application..."
            npm run build

            echo "Restarting PM2 process..."
            if pm2 list | grep -q frontend; then
              pm2 restart frontend
            else
              pm2 start npm --name "frontend" -- start
            fi

            pm2 save
            pm2 status frontend
            pm2 list

      - name: Send success email
        if: success()
        uses: dawidd6/action-send-mail@v3
        with:
          server_address: smtp.gmail.com
          server_port: 587
          username: ${{ secrets.SMTP_USERNAME }}
          password: ${{ secrets.SMTP_PASSWORD }}
          subject: "✅ Frontend Deployed Successfully"
          to: ${{ secrets.MAIL_TO }}
          from: "GitHub Actions <${{ secrets.SMTP_USERNAME }}>"
          body: |
            🚀 Deployment Successful!

            Project: CoverFrontend
            Repository: ${{ github.repository }}
            Branch: main
            Commit: ${{ github.sha }}
            Message: ${{ github.event.head_commit.message }}
            Deployed by: ${{ github.actor }}
            Time: ${{ github.run_started_at }}

      - name: Send failure email
        if: failure()
        uses: dawidd6/action-send-mail@v3
        with:
          server_address: smtp.gmail.com
          server_port: 587
          username: ${{ secrets.SMTP_USERNAME }}
          password: ${{ secrets.SMTP_PASSWORD }}
          subject: "❌ Frontend Deployment Failed"
          to: ${{ secrets.MAIL_TO }}
          from: "GitHub Actions <${{ secrets.SMTP_USERNAME }}>"
          body: |
            ❌ Deployment Failed!

            Repository: ${{ github.repository }}
            Commit: ${{ github.sha }}
            Triggered by: ${{ github.actor }}

            Check GitHub Actions logs for details.
